name: One-shot — apply migration_chicken_spread_single_card

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.SUPABASE_URL }}
      KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Patch dashboards rows 10, 31, 33
        run: |
          set -euo pipefail
          patch() {
            curl -sf -X PATCH "$URL/rest/v1/dashboards?id=eq.$1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              --data "$2"
          }
          patch 10 '{"title":"Brazil Chicken Spread Tracker","description":"Chicken price vs. grain basket spread, in two subtabs. Exports: weekly and monthly SECEX export price (NCM 0207, BCB PTAX FX). Domestic: daily, weekly and monthly CEPEA fresh chicken wholesale price (SP, BRL/kg). Corn 66% + Soy PNA 34% (BRL/sc60kg), 2-month lag.","source":"MDIC · CEPEA/ESALQ · BCB","tags":["Brazil","Chicken","Spread","SECEX","CEPEA","Domestic"]}'
          patch 33 '{"visible_to_all":true}'
          patch 31 '{"title":"Beer Score — Climate Monitor"}'
      - name: Verify
        run: |
          curl -sf "$URL/rest/v1/dashboards?id=in.(10,31,33)&select=id,title,visible_to_all&order=id" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
