name: Update Secex

on:
  schedule:
    # Roda todo dia de 1 a 10 de cada mês às 11h UTC (8h Brasília)
    - cron: "0 11 1-10 * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências
        run: pip install requests pandas

      - name: Roda extractor
        run: python "Agri Monitor/secex/extractor_secex.py"

      # JSON for the Research Dashboard Hub (Feeder upload step comes later).
      - name: Export hub JSON
        run: python "Hub Export/export_agri_monitor_json.py" secex

      - name: Commit e push do .db atualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Agri Monitor/secex/secex.db" "Agri Monitor/secex/secex.json"
          git diff --cached --quiet || git commit -m "chore: atualiza secex.db $(date +'%Y-%m')"
          git push
