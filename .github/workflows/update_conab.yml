name: Update CONAB Safra

on:
  schedule:
    - cron: "0 11 8-20 * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências
        run: pip install requests pandas

      - name: Roda extractor
        run: python "Agri Monitor/conab/extractor_conab.py"

      # JSON for the Research Dashboard Hub (Feeder upload step comes later).
      - name: Export hub JSON
        if: always()
        run: python "Hub Export/export_agri_monitor_json.py" conab

      - name: Commit e push
        # Saves whatever did update even when one source failed (the run stays red).
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Agri Monitor/conab/conab.db" "Agri Monitor/conab/conab.json"
          git diff --cached --quiet || git commit -m "chore: atualiza conab.db $(date +'%Y-%m')"
          git push
