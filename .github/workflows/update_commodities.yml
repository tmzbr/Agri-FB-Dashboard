name: Update Commodity Prices

on:
  schedule:
    # 06:00 UTC, Monday-Friday.
    # Rationale: LME settlement/official prices are published same-day
    # (~12:20-13:25 London time) and Westmetall reflects them shortly
    # after; CBOT wheat/corn and NCDEX barley are also settled well
    # before this time. Running early the next UTC morning guarantees
    # the previous full trading day is available from all sources.
    # Weekends are skipped since none of the sources publish new data then.
    # Adjust the hour below if you find some data isn't ready yet at this time.
    - cron: "0 6 * * 1-5"
  workflow_dispatch: {}  # allows manual runs from the Actions tab

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-dateutil yfinance

      - name: Run daily update script
        working-directory: "Cost Model"
        run: python update_commodities.py

      - name: Export hub JSON
        run: python "Hub Export/export_cost_model_json.py"

      - name: Commit and push updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Cost Model/commodities_prices.db" "Cost Model/cost-model.json"
          git diff --staged --quiet || git commit -m "Daily update: commodity prices ($(date -u +'%Y-%m-%d'))"
          git push

      # Research Dashboard Hub: sends the JSON to the Feeder only when the repo variable
      # DASHBOARD_FEEDER_ENABLED is "true"; until then it checks the files and sends nothing.
      - name: Upload hub JSON to the Feeder
        working-directory: ${{ github.workspace }}
        env:
          DASHBOARD_FEEDER_ENABLED: ${{ vars.DASHBOARD_FEEDER_ENABLED }}
          DASHBOARD_FEEDER_PROJECT_ID: ${{ vars.DASHBOARD_FEEDER_PROJECT_ID }}
          DASHBOARD_FEEDER_API_KEY: ${{ secrets.DASHBOARD_FEEDER_API_KEY }}
        run: python "Hub Export/feeder_upload.py" cost-model.json
