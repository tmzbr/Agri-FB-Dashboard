name: Coleta Completa

on:
  schedule:
    - cron: '0 6 * * *'  # 03:00 BRT
  workflow_dispatch:

jobs:
  coletar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: Coletar Mercearia
        run: python "Supermarket Prices/scraper.py" Mercearia
      - name: Coletar Cervejas
        run: python "Supermarket Prices/scraper.py" Cervejas
      - name: Coletar Carnes
        run: python "Supermarket Prices/scraper.py" Carnes
      - name: Coletar Biscoitos e Massas
        run: python "Supermarket Prices/scraper.py" Biscoitos Massas
      - name: Gerar dashboard
        run: python "Supermarket Prices/gerar_dashboard.py"
      - name: Export hub JSON (beers only)
        run: python "Hub Export/export_beer_prices_json.py"
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp "Supermarket Prices/precos.db" /tmp/precos_local.db
          cp "Supermarket Prices/supermarket_prices.html" /tmp/html_local.html
          cp "Supermarket Prices/beer-prices.json" /tmp/beer_local.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/precos_local.db "Supermarket Prices/precos.db"
          cp /tmp/html_local.html "Supermarket Prices/supermarket_prices.html"
          cp /tmp/beer_local.json "Supermarket Prices/beer-prices.json"
          git add "Supermarket Prices/"
          git diff --staged --quiet || git commit -m "Coleta Completa: $(date '+%d/%m/%Y %H:%M')"
          git push origin main

      # Research Dashboard Hub: sends the JSON to the Feeder only when the repo variable
      # DASHBOARD_FEEDER_ENABLED is "true"; until then it checks the files and sends nothing.
      - name: Upload hub JSON to the Feeder
        working-directory: ${{ github.workspace }}
        env:
          DASHBOARD_FEEDER_ENABLED: ${{ vars.DASHBOARD_FEEDER_ENABLED }}
          DASHBOARD_FEEDER_PROJECT_ID: ${{ vars.DASHBOARD_FEEDER_PROJECT_ID }}
          DASHBOARD_FEEDER_API_KEY: ${{ secrets.DASHBOARD_FEEDER_API_KEY }}
        run: python "Hub Export/feeder_upload.py" beer-prices.json
