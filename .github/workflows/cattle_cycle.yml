name: Refresh Cattle Cycle DB

on:
  # Mondays 12:00 UTC. IBGE releases the quarterly slaughter survey (SIDRA
  # 1092) ~2.5 months after quarter end — a weekly check picks it up within
  # days, and each run re-downloads the full series so revisions land too.
  schedule:
    - cron: '0 12 * * 1'

  workflow_dispatch:

  push:
    paths:
      - 'Beef/Cattle Cycle/extractor_cattle_cycle.py'

jobs:
  refresh-db:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: Beef/Cattle Cycle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run extractor
        run: python extractor_cattle_cycle.py

      - name: Commit updated DB
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cattle_cycle.db
          if git diff --cached --quiet; then
            echo "No changes to cattle_cycle.db — nothing to commit."
          else
            git commit -m "auto: refresh cattle_cycle.db — $(date -u +'%Y-%m-%d %H:%M') UTC"
            # -X ours: in a binary-file conflict the freshly generated DB wins.
            git pull origin main --no-rebase -X ours
            git push
          fi
