name: Refresh Cattle Cycle DB

on:
  # IBGE "Pesquisas Trimestrais do Abate" (SIDRA 1092) calendar, 12:00 BRT:
  #   full release  → between the 5th and 18th of Mar / Jun / Sep / Dec
  #                   (2024-26: 14/03 05/06 05/09 05/12 · 18/03 11/06 10/09
  #                    10/12 · 18/03 16/06 15/09 15/12; next 23/03/2027)
  #   first results → ~9th–19th of Feb / May / Aug / Nov
  # The day moves every quarter, so poll daily on the 5th–25th of those
  # months at 16:00 UTC (13:00 BRT, 1h after release). The extractor leaves
  # the DB untouched unless IBGE published something, so quiet days make no
  # commit. The monthly run on the 1st catches off-calendar revisions.
  #
  # U.S. — NASS "Livestock Slaughter", monthly, 3:00 PM ET on a Thursday
  # between the 19th and 25th (2026: 22/01 19/02 19/03 23/04 21/05 25/06
  # 23/07 20/08 24/09; next 22/10 19/11 24/12). Poll the 19th–26th at
  # 21:00 UTC (5 PM EDT / 4 PM EST).
  #
  # Every run refreshes both countries; each source only writes when it has
  # something new.
  schedule:
    - cron: '0 16 5-25 2,3,5,6,8,9,11,12 *'
    - cron: '0 16 1 * *'
    - cron: '0 21 19-26 * *'

  workflow_dispatch:

  push:
    paths:
      - 'Beef/Cattle Cycle/extractor_cattle_cycle.py'

jobs:
  refresh-db:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: Beef/Cattle Cycle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run extractor
        run: python extractor_cattle_cycle.py

      - name: Commit updated DB
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cattle_cycle.db
          if git diff --cached --quiet; then
            echo "No changes to cattle_cycle.db — nothing to commit."
          else
            git commit -m "auto: refresh cattle_cycle.db — $(date -u +'%Y-%m-%d %H:%M') UTC"
            # -X ours: in a binary-file conflict the freshly generated DB wins.
            git pull origin main --no-rebase -X ours
            git push
          fi
