name: Weekly Beef Data Update

on:
  schedule:
    - cron: '0 12 * * 2'   # toda terça às 12h UTC (9h Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas openpyxl pdfplumber

      - name: Fetch latest data & update beef.db
        run: python "Beef/U.S. Tracker/extractor_beef.py"

      # JSON for the Research Dashboard Hub (Feeder upload step comes later).
      - name: Export hub JSON
        working-directory: .
        run: python "Hub Export/export_us_tracker_json.py" beef

      - name: Commit updated beef.db
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp "Beef/U.S. Tracker/beef.db" /tmp/beef.db
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/beef.db "Beef/U.S. Tracker/beef.db"
          git add "Beef/U.S. Tracker/beef.db" "Beef/U.S. Tracker/us-beef-tracker.json"
          git diff --staged --quiet || git commit -m "chore: weekly beef data update $(date +'%Y-%m-%d')"
          git push origin HEAD:main

      # Research Dashboard Hub: sends the JSON to the Feeder only when the repo variable
      # DASHBOARD_FEEDER_ENABLED is "true"; until then it checks the files and sends nothing.
      - name: Upload hub JSON to the Feeder
        working-directory: ${{ github.workspace }}
        env:
          DASHBOARD_FEEDER_ENABLED: ${{ vars.DASHBOARD_FEEDER_ENABLED }}
          DASHBOARD_FEEDER_PROJECT_ID: ${{ vars.DASHBOARD_FEEDER_PROJECT_ID }}
          DASHBOARD_FEEDER_API_KEY: ${{ secrets.DASHBOARD_FEEDER_API_KEY }}
        run: python "Hub Export/feeder_upload.py" us-beef-tracker.json
