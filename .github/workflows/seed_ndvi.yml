name: Seed NDVI (history → Supabase)

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Anos: 2023 | 2000-2026 | 2022,2025"
        default: "2000-2026"
      mode:
        description: "full = todas as janelas publicadas · missing = só as que faltam no banco"
        type: choice
        options: [full, missing]
        default: full
      source:
        description: "auto = Planetary Computer, depois AppEEARS · pc · appeears"
        type: choice
        options: [auto, pc, appeears]
        default: auto
      limit_windows:
        description: "Teste: processa só N janelas por ano (vazio = todas)"
        default: ""

concurrency:
  group: ndvi-load
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.m.outputs.years }}
    steps:
      - id: m
        env:
          YEARS: ${{ inputs.years }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          ys = set()
          for part in os.environ["YEARS"].replace(" ", "").split(","):
              if "-" in part:
                  a, b = part.split("-"); ys |= set(range(int(a), int(b) + 1))
              elif part:
                  ys.add(int(part))
          ys = sorted(y for y in ys if 2000 <= y <= 2100)
          assert ys, "nenhum ano válido em 'years'"
          print("years=" + json.dumps(ys))
          PY

  seed:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: ${{ fromJSON(needs.plan.outputs.years) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy requests shapely pyproj rasterio openpyxl
      - name: Seed ${{ matrix.year }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
          EARTHDATA_PASS: ${{ secrets.EARTHDATA_PASS }}
          LIMIT: ${{ inputs.limit_windows }}
        run: |
          D="Climate Monitor/NDVI Monitor"
          if [ -f "$D/ndvi_monitor.py" ]; then CMD=(python "$D/ndvi_monitor.py" seed); else CMD=(python "$D/seed_ndvi_supabase.py"); fi
          ARGS=(--mode "${{ inputs.mode }}" --years "${{ matrix.year }}" --source "${{ inputs.source }}" --workers 4 --flush-every 8 --max-wait 120)
          if [ -n "$LIMIT" ]; then ARGS+=(--limit-windows "$LIMIT"); fi
          "${CMD[@]}" "${ARGS[@]}"
